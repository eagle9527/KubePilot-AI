# 构建 KubePilot AI Controller 镜像并推送到 GitHub Container Registry (ghcr.io)
#
# 产物：ghcr.io/<owner>/kubepilot-ai:<tag>
#   - 推送 main 分支     -> main / latest / sha-xxxxxxx
#   - 推送 v* 标签       -> v1.2.3 / 1.2.3 / 1.2 / latest
#   - Pull Request       -> 仅校验能否构建，不推送
#   - 手动触发           -> workflow_dispatch
#
# 说明：本项目 Dockerfile 基于 scratch，需要预先编译好的 Linux 二进制，
# 所以采用「矩阵分别构建每个架构 -> 按 digest 推送 -> 合并 manifest list」的方式。

name: Build and Push Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASENAME: kubepilot-ai
  # Go 源码所在目录（即构建上下文）
  BUILD_CONTEXT: kubeai-controller

# 同一分支/标签重复触发时，取消上一次未完成的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 1. 分架构构建并推送（push by digest） ============
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # GHCR 要求镜像名全小写，这里统一转换
      - name: 生成镜像名
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}" >> "$GITHUB_ENV"

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ env.BUILD_CONTEXT }}/go.sum

      # Dockerfile 直接 COPY bin/kubeai-controller，先交叉编译出对应架构的静态二进制
      - name: 编译 linux/${{ matrix.arch }} 二进制
        working-directory: ${{ env.BUILD_CONTEXT }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" -o bin/kubeai-controller ./cmd/main.go
          file bin/kubeai-controller

      # Dockerfile 中 basefiles 阶段有 apk RUN 指令，跨架构构建需要 QEMU
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 本步骤只用它的 labels 输出，tag 由 merge 阶段统一生成
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      # PR：只验证能否构建成功，不推送
      - name: 构建校验（PR，不推送）
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # 正式构建：按 digest 推送，暂不打 tag，等 merge 阶段合成 manifest list
      - name: 构建并推送（by digest）
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          echo "$DIGEST" > "/tmp/digests/${DIGEST#sha256:}"

      - name: 上传 digest 产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============ 2. 合并各架构 digest，生成带 tag 的多架构镜像 ============
  merge:
    name: Push manifest list
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: 下载 digest 产物
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: 生成镜像名
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}" >> "$GITHUB_ENV"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          # main 分支与 v* 标签都会更新 latest
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: 合成 manifest list 并推送
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: 查看镜像信息
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
