# KubePilot AI Incident 示例
# 这个示例展示了如何手动创建一个 AI 分析事件

apiVersion: kubeai.io/v1
kind: AIIncident
metadata:
  name: example-pod-crash
  namespace: default
  labels:
    app.kubernetes.io/managed-by: manual
    severity: high
spec:
  # 发生异常的资源信息
  resource:
    kind: Pod
    name: example-app-7d8f9b2c5-a1b2c
    namespace: default
    apiVersion: v1
  
  # 触发条件
  trigger:
    type: CrashLoopBackOff
    severity: High
    message: "Back-off restarting failed container"
    count: 5
  
  # AI 分析配置
  analyze:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.3
    maxTokens: 2000
    # 上下文信息（可选，由 Controller 自动填充）
    context:
      logs:
        - "Error: Connection refused to database"
        - "at /app/server.js:42:15"
      metrics:
        cpu: "85%"
        memory: "512Mi"
        restart_count: "5"
      events:
        - "Warning: Unhealthy Liveness probe failed"

---
# 另一个示例：Node 压力事件
apiVersion: kubeai.io/v1
kind: AIIncident
metadata:
  name: example-node-pressure
  namespace: default
spec:
  resource:
    kind: Node
    name: worker-node-1
    apiVersion: v1
  
  trigger:
    type: MemoryPressure
    severity: Critical
    message: "Node has memory pressure"
    count: 1
  
  analyze:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.3

---
# 使用 kubectl 命令创建 AIIncident 的示例：
#
# 1. 从文件创建：
# kubectl apply -f example-aiincident.yaml
#
# 2. 使用命令行直接创建：
# cat <<EOF | kubectl apply -f -
# apiVersion: kubeai.io/v1
# kind: AIIncident
# metadata:
#   name: test-incident
#   namespace: default
# spec:
#   resource:
#     kind: Pod
#     name: test-pod
#     namespace: default
#   trigger:
#     type: CrashLoopBackOff
#     severity: High
#   analyze:
#     provider: deepseek
# EOF
#
# 3. 查看 AIIncident 状态：
# kubectl get aiincident -n default
# kubectl describe aiincident <name> -n default
