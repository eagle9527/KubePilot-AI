# KubePilot AI Controller Secrets
# 用于存储敏感的 API 密钥和 Webhook URL
# 注意：这个文件只是一个模板，请在使用前填入真实的值并妥善保管

apiVersion: v1
kind: Secret
metadata:
  name: kubepilot-ai-secrets
  namespace: kubeai-system
  labels:
    app.kubernetes.io/name: kubepilot-ai
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # LLM Provider API Keys
  # 请根据需要配置相应的 API Key
  
  # DeepSeek API Key
  # 获取地址：https://platform.deepseek.com/
  deepseek-api-key: "your-deepseek-api-key-here"

  # OpenAI API Key
  # 获取地址：https://platform.openai.com/
  openai-api-key: "your-openai-api-key-here"

  # 通义千问 API Key (DashScope)
  # 获取地址：https://dashscope.aliyun.com/
  qwen-api-key: "your-qwen-api-key-here"

  # Claude API Key (Anthropic)
  # 获取地址：https://console.anthropic.com/
  claude-api-key: "your-claude-api-key-here"

  # 通知渠道配置

  # 企业微信 Webhook URL
  # 获取地址：https://work.weixin.qq.com/help?doc_id=13376
  # 格式：https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxxxxxx
  wechat-webhook-url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your-key-here"

  # 钉钉 Webhook URL
  # 获取地址：https://open.dingtalk.com/document/robots/custom-robot-access
  # 格式：https://oapi.dingtalk.com/robot/send?access_token=xxxxxxxxxx
  dingtalk-webhook-url: "https://oapi.dingtalk.com/robot/send?access_token=xxxxxxxxxx"
  
  # Slack Webhook URL
  # 获取地址：https://api.slack.com/messaging/webhooks
  slack-webhook-url: "https://hooks.slack.com/services/your/webhook/url"